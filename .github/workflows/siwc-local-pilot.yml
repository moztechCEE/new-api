name: SIWC owner DEV protocol regression

on:
  push:
    branches: ['codex/**']
    paths:
      - 'bin/siwc-local-*.mjs'
      - 'bin/siwc-gateway-*.mjs'
      - 'bin/corely-model-contract.mjs'
      - 'bin/corely-vm-model-job-client*.mjs'
      - 'bin/corely-vm-model-worker*.mjs'
      - 'bin/codex-harness-*.mjs'
      - '.github/workflows/siwc-local-pilot.yml'
      - 'deploy/gce/siwc*'
      - 'relay/responses_websocket_test.go'
      - '.dockerignore'
  pull_request:
    paths:
      - 'bin/siwc-local-*.mjs'
      - 'bin/siwc-gateway-*.mjs'
      - 'bin/corely-model-contract.mjs'
      - 'bin/corely-vm-model-job-client*.mjs'
      - 'bin/corely-vm-model-worker*.mjs'
      - 'bin/codex-harness-*.mjs'
      - '.github/workflows/siwc-local-pilot.yml'
      - 'deploy/gce/siwc*'
      - 'relay/responses_websocket_test.go'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-relay-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum
      - name: Real Go Responses passthrough, SSE and first-attempt retry contract
        run: go test ./relay -run '^TestSIWCGatewayResponsesPassthroughAndSingleAttempt$' -count=1
  local-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Check syntax
        run: |
          node --check bin/siwc-local-runtime.mjs
          node --check bin/siwc-local-pilot.mjs
          node --check bin/siwc-local-runtime.test.mjs
          node --check bin/siwc-local-sessions.mjs
          node --check bin/siwc-local-vm.mjs
          node --check bin/siwc-local-sessions.test.mjs
          node --check bin/siwc-local-model-port.mjs
          node --check bin/siwc-gateway-model-port.mjs
          node --check bin/siwc-local-corely-worker.mjs
          node --check bin/corely-model-contract.mjs
          node --check bin/corely-vm-model-job-client.mjs
          node --check bin/corely-vm-model-job-client.test.mjs
          node --check bin/corely-vm-model-worker.mjs
          node --check bin/corely-vm-model-worker.test.mjs
          node --check bin/codex-harness-pilot.mjs
          node --check bin/codex-harness-pilot.test.mjs
          node --check bin/codex-harness-permissions-canary.mjs
          node --check bin/codex-harness-permissions-canary.test.mjs
          node --check bin/codex-harness-candidate-contract.mjs
          node --check bin/codex-harness-corely-client.mjs
          node --check bin/codex-harness-corely-client.test.mjs
          node --check bin/codex-harness-model-session.mjs
          node --check bin/codex-harness-model-session.test.mjs
          node --check bin/codex-harness-model-job-client.mjs
          node --check bin/codex-harness-model-job-client.test.mjs
      - name: Run synthetic offline protocol regression
        run: env -i PATH="$PATH" HOME="$RUNNER_TEMP" node --test bin/siwc-local-runtime.test.mjs bin/siwc-local-sessions.test.mjs bin/siwc-gateway-model-port.test.mjs
      - name: Run synthetic offline harness regression
        run: env -i PATH="$PATH" HOME="$RUNNER_TEMP" node --test bin/codex-harness-*.test.mjs bin/corely-vm-model-job-client.test.mjs bin/corely-vm-model-worker.test.mjs
      - name: Build and smoke-test the private VM runtime without network or credentials
        if: matrix.node == '22'
        run: |
          docker build --network=none -f deploy/gce/siwc.Dockerfile -t new-api-siwc-dev-ci .
          SIWC_IMAGE=new-api-siwc-dev-ci docker compose -f deploy/gce/siwc-compose.yaml config --quiet
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node new-api-siwc-dev-ci --input-type=module -e "const worker = await import('/opt/new-api-siwc-dev/corely-vm-model-worker.mjs'); if (typeof worker.runCorelyVmModelWorker !== 'function' || typeof worker.openCorelyVmModelIdentity !== 'function') throw new Error('WORKER_IMPORT_CONTRACT');"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /state:rw,noexec,nosuid,nodev,mode=0700,uid=1000,gid=1000 new-api-siwc-dev-ci status --state-dir /state
