name: SIWC local pilot regression

on:
  push:
    branches: ['codex/**']
    paths:
      - 'bin/siwc-local-*.mjs'
      - 'bin/codex-harness-*.mjs'
      - '.github/workflows/siwc-local-pilot.yml'
  pull_request:
    paths:
      - 'bin/siwc-local-*.mjs'
      - 'bin/codex-harness-*.mjs'
      - '.github/workflows/siwc-local-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Check syntax
        run: |
          node --check bin/siwc-local-runtime.mjs
          node --check bin/siwc-local-pilot.mjs
          node --check bin/siwc-local-runtime.test.mjs
          node --check bin/codex-harness-pilot.mjs
          node --check bin/codex-harness-pilot.test.mjs
      - name: Run synthetic offline protocol regression
        run: env -i PATH="$PATH" HOME="$RUNNER_TEMP" node --test bin/siwc-local-runtime.test.mjs
      - name: Run synthetic offline harness regression
        run: env -i PATH="$PATH" HOME="$RUNNER_TEMP" node --test bin/codex-harness-pilot.test.mjs
