steps:
  - id: source
    name: gcr.io/cloud-builders/git
    entrypoint: sh
    args:
      - -ceu
      - |
        git init /workspace/source
        cd /workspace/source
        git remote add origin https://github.com/moztechCEE/new-api.git
        git fetch --depth=1 origin ${_SOURCE_SHA}
        git checkout --detach FETCH_HEAD
        test "$$(git rev-parse HEAD)" = '${_SOURCE_SHA}'
  - id: backend
    name: golang:1.26.1-alpine@sha256:2389ebfa5b7f43eeafbd6be0c3700cc46690ef842ad962f6c5bd6be49ed82039
    dir: /workspace/source
    entrypoint: sh
    env: ['GOWORK=off', 'CGO_ENABLED=0', 'GOEXPERIMENT=greenteagc']
    args:
      - -ceu
      - |
        apk add --no-cache make git python3
        PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy/gce -p 'test_*.py' -v
        mkdir -p web/dist
        touch web/dist/index.html
        go vet ./...
        (cd relaykit && go vet ./... && go build ./...)
        (cd tokenkit && go vet ./... && go build ./...)
        go build ./...
        make test
  - id: bun-tool
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -ceu
      - |
        mkdir -p /workspace/bin
        docker create --name new-api-bun-tool oven/bun:1.4.0@sha256:5ff609364c049b54eb0ff560ec96319729a972078ef2c755d758f0c6ef89c2d6
        docker cp new-api-bun-tool:/usr/local/bin/bun /workspace/bin/bun
        docker rm new-api-bun-tool
  - id: frontend
    name: node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    dir: /workspace/source/web
    entrypoint: sh
    args:
      - -ceu
      - |
        export PATH=/workspace/bin:$$PATH
        node -e 'if (!process.versions.node || process.versions.bun) process.exit(1); console.log("Node runtime " + process.versions.node)'
        bun install --frozen-lockfile
        bun run typecheck
        node node_modules/vitest/vitest.mjs run
        DISABLE_ESLINT_PLUGIN=true bun run build
  - id: image
    name: gcr.io/cloud-builders/docker
    dir: /workspace/source
    args: ['build', '--label', 'org.opencontainers.image.revision=${_SOURCE_SHA}', '--label', 'org.opencontainers.image.source=https://github.com/moztechCEE/new-api', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
timeout: 3600s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: '100'
